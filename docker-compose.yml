services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-lokalverk}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-lokalverk}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cms:
    build:
      context: ./cms
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-lokalverk}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi_dev_password}
      APP_KEYS: ${APP_KEYS:-dev-app-key-a,dev-app-key-b}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-dev-api-token-salt-change-me}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-admin-jwt-secret-change-me}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-dev-transfer-token-salt-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-users-permissions-jwt-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lokalverk.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    expose:
      - "1337"
    volumes:
      - strapi_uploads:/opt/app/public/uploads

  client:
    build:
      context: ./client
    restart: unless-stopped
    expose:
      - "4173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - cms
      - client
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  strapi_uploads:
